# yolov8n_weld.yaml
# YOLOv8n + 额外 P2(160×160) 小目标检测头
# 目的：气孔、弧坑裂纹等缺陷常仅占几个像素，标准 P3/P4/P5 三头对小目标召回不足；
#       新增 P2 高分辨率头（论文经验 +11% mAP，PLOS ONE 2024 同类做法）。
# 用法：weld_train.py 加 --small-head 开关即从该架构训练（backbone 从 yolov8n.pt 迁移）。
# 注意：新增 P2 头随机初始化，需更多 epoch 收敛；与默认 yolov8n.pt 路径互斥，仅 --small-head 时启用。

nc: 5
scales:
  n: [0.25, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]   # 索引 2：P2 特征 (160×160, 128ch)
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]   # 索引 4：P3 特征 (80×80, 256ch)
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]   # 索引 6：P4 特征 (40×40, 512ch)
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]  # 索引 8：P5 特征 (20×20, 1024ch)
  - [-1, 1, SPPF, [1024, 5]]    # 索引 9

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]
  # ===== 新增 P2 小目标分支（反向上采样到 160×160）=====
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 索引 22：20×20 → 40×40
  - [[-1, 6], 1, Concat, [1]]                     # 索引 23：+ P4(40×40) → 1536ch
  - [-1, 3, C2f, [768]]                           # 索引 24
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 索引 25：40×40 → 80×80
  - [[-1, 4], 1, Concat, [1]]                     # 索引 26：+ P3(80×80) → 1024ch
  - [-1, 3, C2f, [384]]                           # 索引 27
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]   # 索引 28：80×80 → 160×160
  - [[-1, 2], 1, Concat, [1]]                     # 索引 29：+ P2(160×160) → 512ch
  - [-1, 3, C2f, [192]]                           # 索引 30：P2 检测特征
  - [[30, 15, 18, 21], 1, Detect, [nc]]           # P2, P3, P4, P5
