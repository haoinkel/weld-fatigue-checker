name: Build unsigned IPA (Sideloadly)

# 免费 Apple ID + Sideloadly 侧载路线：
# 用 GitHub 免费 macOS runner 把源码编成【未签名】IPA，下载后在你 Windows 上用
# Sideloadly + 免费 Apple ID 签名并装到 iPad。无需 $99 开发者账号，无需自有 Mac。
#
# 触发：push 到 main/master，或手动（Actions 页 → Run workflow）
# 产物：Artifacts 里的 WeldFatigueChecker-unsigned.ipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned IPA
        working-directory: app_ios/native
        run: bash build.sh ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WeldFatigueChecker-unsigned
          path: app_ios/native/build/WeldFatigueChecker-unsigned.ipa
          if-no-files-found: error
