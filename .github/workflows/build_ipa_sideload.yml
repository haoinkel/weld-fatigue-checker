name: Build unsigned IPA (Sideloadly)

# 免费 Apple ID + Sideloadly 侧载路线：
# 用 GitHub 免费 macOS runner 把源码编成【未签名】IPA，下载后在你 Windows 上用
# Sideloadly + 免费 Apple ID 签名并装到 iPad。无需 $99 开发者账号，无需自有 Mac。
#
# 触发：push 到 main/master，或手动（Actions 页 → Run workflow）
# 产物：Artifacts 里的 WeldFatigueChecker-unsigned.ipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest installed Xcode
        run: |
          set -e
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1); fi
          echo "Using Xcode at: $XCODE_APP"
          xcodebuild -version
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"

      # 缓存 OCCT iOS 静态库（libOCCT.a 较大、构建耗时长；缓存命中后秒过）
      - name: Cache OCCT
        uses: actions/cache@v4
        with:
          path: app_ios/native/Vendor/OCCT
          key: occt-8.0.1-ios-arm64-v2

      # 构建 OCCT（启用 STEP/IGES 直读）。build.sh 检测到 Vendor/OCCT 后自动开启 USE_OCCT。
      - name: Build OCCT for iOS (enable STEP/IGES)
        working-directory: app_ios/native
        run: |
          set -e
          command -v cmake >/dev/null 2>&1 || brew install cmake
          OCCT_SKIP_SIM=1 bash build_occt_ios.sh

      - name: Build unsigned IPA
        working-directory: app_ios/native
        run: bash build.sh ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: WeldFatigueChecker-unsigned
          path: app_ios/native/build/WeldFatigueChecker-unsigned.ipa
          if-no-files-found: error
